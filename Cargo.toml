[workspace]
members = ["crates/*"]
# Resolver v3 is MSRV-aware: it will not select a dependency version requiring
# a newer rustc than `workspace.package.rust-version`. Without it, a
# `cargo update` silently pulls crates the declared toolchain cannot build —
# the AWS SDK crates did exactly that in the workspace this code was
# extracted from.
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2021"
# The real floor, inherited from the original monorepo, and it is not arbitrary:
#   * the `mpz` graph under the tlsn fork (libid-org/mpz) declares Rust 1.95;
#   * the AWS SDK crates declare 1.94.1.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libid-org/libid-rs"

[workspace.dependencies]
# Intra-workspace crates. Path + version so the publishable subset can be
# released to crates.io while local builds resolve in-tree.
libid-crypto = { path = "crates/libid-crypto", version = "0.3.0" }
libid-signer = { path = "crates/libid-signer", version = "0.3.0" }
libid-transcript = { path = "crates/libid-transcript", version = "0.3.0" }
libid-ceremony = { path = "crates/libid-ceremony", version = "0.3.0" }

alloy = { version = "1", default-features = false }
# KMS-backed signing. alloy's `signer-aws` feature re-exports
# `alloy::signers::aws::AwsSigner`, but constructing one needs an
# `aws_sdk_kms::Client`, so the SDK is a direct dependency too. Both are
# pinned to the 1.x line so cargo unifies them with whatever alloy resolves.
aws-config = "1"
aws-sdk-kms = "1"
# Pinned exactly: the encoded bytes are a signed preimage, so a layout change
# in a patch release would change what every notary signs.
bincode = { version = "=2.0.1", features = ["derive"] }
hex = "0.4"
# The ceremony profiles, generated in libid-contracts from the same
# `profiles.json` its verifiers read. Zero dependencies of its own.
libid-profiles = "0.10"
# The generated handle table, for the test that keeps the platform names of
# the ceremony profiles and the identity system from drifting apart. A
# dev-dependency only: nothing published carries it.
libid-identity = "0.10"
# Chunk-size parsing. Hand-rolling it is how a malformed chunk becomes a short
# body instead of an error.
httparse = "1"
http-body-util = "0.1"
hyper = { version = "1.1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["full"] }
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tiny-keccak = { version = "2.0", features = ["keccak"] }
# libID's fork of TLSNotary, at the head of its `integration/notary-alpha15`
# branch: upstream main (0fe3c32, past alpha.15) plus the fixes the notary and
# every prover it talks to must share -- each RCOT consumer on its own,
# domain-separated KOS instance (tlsnotary/tlsn#1173), the verifier sizing the
# transcript from what it recorded instead of what the prover declared
# (libid-org/tlsn#2, which changes `ProveRequestMsg` on the wire), and the mpz
# fork patched in below. A GIT dependency: any crate that names it in its
# manifest cannot be published to crates.io (see crates/libid-tlsn/Cargo.toml).
tlsn = { git = "https://github.com/libid-org/tlsn", rev = "94aaaf33f3361d1218f9abb4c82b5c58a9199460" }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
webpki-root-certs = "1.0"

# The fork's own patch, restated: a dependency's `[patch]` never reaches the
# workspace that builds it, so without this the fork's tlsn would build against
# upstream mpz and lose the KOS domain separation and the executor lifetime fix
# it was pinned for. Keep the rev equal to the fork's.
[patch."https://github.com/privacy-ethereum/mpz"]
clmul = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
matrix-transpose = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-circuits = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-circuits-core = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-circuits-data = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-cointoss = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-cointoss-core = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-common = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-core = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-fields = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-garble = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-garble-core = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-hash = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-ideal-vm = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-memory-core = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-ole = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-ole-core = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-ot = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-ot-core = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-share-conversion = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-share-conversion-core = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-vm-core = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-zk = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
mpz-zk-core = { git = "https://github.com/libid-org/mpz", rev = "1dd2349d52aeea038d77fb0816f781c6b714fe77" }
