name: CI

# Four PR jobs (rust, dco, versions, publish-check) and two release-only jobs
# (verify-tag, publish-crates). Job ids are stable on purpose: the release
# jobs at the bottom hang their `needs:` off these names.
#
# Releases: publishing a GitHub Release tagged `v<version>` runs this same
# workflow with the release event. rust/versions/publish-check run on every
# event; verify-tag and publish-crates are release-only. One workspace
# version, one tag, one registry — see the "Releasing" section of the README.
#
# `libid-tlsn` never publishes: it carries a git dependency on the upstream
# `tlsn` crate (which has no crates.io release), so it is `publish = false`
# and consumers take it as a git dependency on the release tag. It still
# builds, lints and tests here like every other member.
#
# Every third-party action is pinned by commit SHA, with the tag in a comment,
# so a moved tag cannot change what executes.

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  # Superseded pushes stop burning minutes immediately.
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Every cargo invocation, not just clippy, treats warnings as errors.
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always
  # Incremental state is written, cached and never read in CI — every job
  # starts from a restored cache and never rebuilds the same crate twice.
  CARGO_INCREMENTAL: 0
  # Rust stable, pinned so a toolchain release cannot break CI mid-PR.
  RUST_VERSION: 1.97.1
  # Nightly is for `cargo +"$NIGHTLY" fmt` ONLY: rustfmt options like
  # `imports_granularity` are nightly-only, and stable rustfmt does not reject
  # them — it silently IGNORES them and reports success. Dated pin so a
  # nightly formatting change cannot turn the tree red overnight.
  NIGHTLY: nightly-2026-08-10

jobs:
  # ---------------------------------------------------------------------------
  # Rust: formatting, clippy, tests — the whole workspace, including the
  # git-only libid-tlsn member.
  # ---------------------------------------------------------------------------
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nightly first, stable second: this action makes the LAST toolchain it
      # installs the default, and everything except `cargo +"$NIGHTLY" fmt`
      # must run on the pinned stable.
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rustfmt
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Formatting (nightly rustfmt)
        # +"$NIGHTLY", not +nightly: the bare channel name makes rustup fetch
        # the LATEST nightly (without the rustfmt component) instead of the
        # pinned one installed above.
        run: cargo +"$NIGHTLY" fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all

  # ---------------------------------------------------------------------------
  # DCO: every commit carries a Signed-off-by trailer, as CONTRIBUTING.md
  # promises. Plain git over the event's commit range — no marketplace action,
  # so there is nothing to pin and nothing to compromise.
  # ---------------------------------------------------------------------------
  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A release event carries no commit range — every commit it points at was
    # already DCO-checked on its PR — and the range plumbing below would only
    # fail on the empty variables.
    if: github.event_name != 'release'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the PR base and the push's `before` are reachable
          # only in a complete clone, and the repo is small.
          fetch-depth: 0

      - name: Every commit is signed off
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            # Push to main. `before` is all zeros on a branch creation and may
            # be unreachable after a force push; in either case there is no
            # honest range, so fall back to the head commit alone rather than
            # failing on plumbing.
            zero="0000000000000000000000000000000000000000"
            if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] \
              && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              range="$PUSH_BEFORE..$PUSH_AFTER"
            else
              echo "No usable push range; checking only the head commit."
              range="$PUSH_AFTER^!"
            fi
          fi

          # Merge commits are exempt, as in the standard DCO probot: nobody
          # authors a merge, and the merged commits are themselves in range.
          missing=0
          for sha in $(git rev-list --no-merges "$range"); do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            if git log -1 --format=%B "$sha" \
              | grep -Fxiq "Signed-off-by: $author"; then
              continue
            fi
            echo "::error::commit $sha lacks Signed-off-by matching its author: $author"
            git log -1 --format='  %h %s (%an)' "$sha"
            missing=1
          done

          if [ "$missing" -ne 0 ]; then
            echo "See CONTRIBUTING.md: every commit must certify the DCO."
            exit 1
          fi
          echo "All commits in $range are signed off."

  # ---------------------------------------------------------------------------
  # One version, everywhere. Every crate inherits the workspace version, and
  # this check fails the PR the moment a crate detaches — release day is too
  # late to find out.
  # ---------------------------------------------------------------------------
  versions:
    name: Version fields agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Crates inherit the workspace version
        run: ./.github/workflows/scripts/verify-tag.sh

  # ---------------------------------------------------------------------------
  # Publishability, checked on every PR: the four publishable crates dry-run
  # from a plain checkout. Cargo (>= 1.90) verifies interdependent packages
  # against a simulated registry, so unpublished intra-workspace versions
  # resolve. libid-tlsn is publish = false and is deliberately not named
  # here — cargo would refuse it anyway (git dependency on tlsn).
  # ---------------------------------------------------------------------------
  publish-check:
    name: Publish dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Packs each crate and rebuilds it from the packaged tarball, proving
      # the published form compiles without the rest of the repo.
      - name: cargo publish --dry-run
        run: >
          cargo publish --dry-run
          -p libid-crypto
          -p libid-transcript
          -p libid-attestations
          -p libid-signer

  # ---------------------------------------------------------------------------
  # Release-only jobs from here down. A release is cut by publishing a GitHub
  # Release tagged v<version>; nothing publishes from pushes or PRs.
  # ---------------------------------------------------------------------------

  # The tag names the version the manifests already carry — the tag is a
  # pointer, never a source. Everything that publishes needs this first.
  verify-tag:
    name: Release tag matches versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag equals workspace version
        run: ./.github/workflows/scripts/verify-tag.sh "${{ github.event.release.tag_name }}"

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [verify-tag, versions, rust, publish-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Dependency order with a sparse-index idempotency check per crate: a
      # re-run after a partially failed release must not hard-fail on the
      # half that already landed. See the script for the crate list.
      - name: cargo publish (dependency order, skip already-published)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: ./.github/workflows/scripts/publish-crates.sh "${TAG#v}"
