[package]
name = "libid-transcript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "tlsn-free half of the libID MPC-TLS toolkit: HTTP/JSON transcript range math for selective disclosure, the ceremony reveal layouts, and the length-prefixed JSON protocol a notary and a prover speak once MPC-TLS closes."
keywords = ["tls", "notary", "zktls", "transcript", "mpc"]
categories = ["cryptography", "parser-implementations"]

[dependencies]
httparse.workspace = true
libid-profiles.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
# The generated platform names, to check the profile table against.
libid-identity.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }
