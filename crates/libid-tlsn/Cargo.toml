# ============================================================================
# NOT PUBLISHABLE TO CRATES.IO — `publish = false` below is load-bearing.
#
# This crate depends on `tlsn`, which exists only as a GIT dependency (the
# TLSNotary project publishes nothing to crates.io as of 2026-08: the sparse
# index 404s for tlsn, tlsn-core, tlsn-prover and tlsn-verifier). Cargo
# refuses to publish any crate whose manifest names a git dependency, so this
# crate stays git-only until upstream cuts a crates.io release matching the
# pinned rev. Consumers (the notary repo) take it as
#   libid-tlsn = { git = "https://github.com/libid-org/libid-rs", tag = "v<version>" }
#
# Everything tlsn-free was deliberately pushed down into `libid-transcript`
# (published) so this crate is ONLY the session driver.
# ============================================================================
[package]
name = "libid-tlsn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MPC-TLS session driver over the upstream tlsn crate: run a prover or verifier (notary) session over any async socket, with selective disclosure computed by libid-transcript. Git-only until tlsn publishes to crates.io."
publish = false

[dependencies]
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
libid-transcript.workspace = true
thiserror.workspace = true
tlsn.workspace = true
# `macros` is for `tokio::select!`, racing session setup against the driver.
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
webpki-root-certs.workspace = true

[dev-dependencies]
# The driver-task leak regression test builds its own runtime so
# `Runtime::metrics().num_alive_tasks()` counts only tasks the crate spawned.
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros"] }
